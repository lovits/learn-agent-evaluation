services:
  course:
    build: .
    image: learn-agent-evaluation:local
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${COURSE_PORT:-8765}:8000"
    environment:
      KNOWLEDGE_DIR: /data/knowledge
      RUNS_DIR: /data/runs
      WORKSPACES_DIR: /data/workspaces
      MODEL_BRIDGE_URL: "${MODEL_BRIDGE_URL:-http://host.docker.internal:8766/next}"
      JUDGE_BRIDGE_URL: "${JUDGE_BRIDGE_URL:-http://host.docker.internal:8768/judge}"
      GENERATION_BRIDGE_URL: "${GENERATION_BRIDGE_URL:-http://host.docker.internal:8769/generate}"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      RAGAS_DO_NOT_TRACK: "true"
    volumes:
      - type: bind
        source: ${KNOWLEDGE_DIR:-./knowledge_base}
        target: /data/knowledge
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runs
        target: /data/runs
        bind:
          create_host_path: false
      - type: bind
        source: ./workspaces
        target: /data/workspaces
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  verifier:
    image: learn-agent-evaluation:local
    profiles: ["verify"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: none
    environment:
      WORKSPACES_DIR: /data/workspaces
      RUNS_DIR: /data/runs
    volumes:
      - ./workspaces:/data/workspaces:ro
      - ./runs:/data/runs
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python", "-m", "course.grade"]
    command: ["--help"]
