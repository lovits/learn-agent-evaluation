<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Learn Agent Evaluation</title>
<style>
:root {color-scheme:light;--ink:#252823;--paper:#f7f5ef;--line:#dfdfd3;--accent:#23674b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.85 system-ui,-apple-system,"PingFang SC",sans-serif}
header{padding:22px max(24px,calc((100% - 1040px)/2));border-bottom:1px solid var(--line);background:#edeee6}
header strong{letter-spacing:.1em;font-size:13px}nav{display:flex;gap:8px 20px;flex-wrap:wrap;margin-top:10px;font-size:14px}
a{color:var(--accent);text-underline-offset:4px}nav a{min-height:44px;padding:7px 0;display:inline-block}main{max-width:1040px;padding:38px 28px 90px;margin:auto}
h1{font-size:clamp(28px,5vw,42px);line-height:1.35;margin:0 0 28px}h2{margin-top:44px;font-size:24px}h3{margin-top:28px}
pre{background:#222923;color:#f3f4e9;padding:20px;overflow:auto;border-radius:8px;font:14px/1.7 ui-monospace,monospace}
code{font-family:ui-monospace,monospace;overflow-wrap:anywhere}p>code,li>code{background:#e9ecdf;padding:2px 5px;border-radius:3px}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}th,td{padding:10px 14px;border:1px solid var(--line);text-align:left}th{background:#e9ecdf}
blockquote{margin:22px 0;border-left:4px solid var(--accent);padding:4px 20px;background:#eef0e5}
input,button{font:inherit;padding:10px;border:1px solid var(--line);border-radius:5px}button{background:var(--accent);color:white;cursor:pointer}
:focus-visible{outline:3px solid #ce792d;outline-offset:3px}
@media(max-width:600px){main{padding:26px 18px}header{padding:18px}pre{font-size:12px}}
</style>
<header><strong>LEARN AGENT EVALUATION / 从项目学评测</strong><nav>{{NAV}}</nav></header>
<main>{{BODY}}</main>
</html>
