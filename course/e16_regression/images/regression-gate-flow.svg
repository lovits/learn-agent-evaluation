<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" viewBox="0 0 725 777" width="725" height="777"><title id="title">第16课：关键条件与持续回归</title><desc id="desc">保留本课机制和评测关系。原生 SVG 文字与路径，放大可读。</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a5f" /><stop offset="100%" stop-color="#2563eb" /></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker></defs><rect width="100%" height="100%" rx="8" fill="#fafbfc" /><rect width="100%" height="48" rx="8" fill="url(#header)" /><rect x="0" y="40" width="100%" height="8" fill="url(#header)" /><text x="362.5" y="31" fill="white" font-size="18" text-anchor="middle" font-weight="700"><tspan x="362.5" y="31">第16课：关键条件与持续回归</tspan></text><g transform="translate(12,64)"><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="freeze"><g transform="translate(0.5,0.5)"><rect x="227" y="12" width="240" height="60" rx="9" ry="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.6" /></g><g><g><text x="347" y="37" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="347" y="37">复核失败，补充任务</tspan><tspan x="347" y="56">冻结资料、判据与版本</tspan></text></g></g></g><g data-cell-id="run"><g transform="translate(0.5,0.5)"><rect x="227" y="117" width="260" height="65" rx="9.75" ry="9.75" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" /></g><g><g><text x="357" y="145" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="357" y="145">同题运行两个版本</tspan><tspan x="357" y="164">独立检查文件＋DeepEval 评分</tspan></text></g></g></g><g data-cell-id="known"><g transform="translate(0.5,0.5)"><path d="M 357 227 L 447 274.5 L 357 322 L 267 274.5 Z" fill="#fff7ed" stroke="#d97706" stroke-miterlimit="10" stroke-width="1.6" /></g><g><g><text x="357" y="270" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="357" y="270">每条都有</tspan><tspan x="357" y="289">有效证据与裁决？</tspan></text></g></g></g><g data-cell-id="blocked"><g transform="translate(0.5,0.5)"><rect x="12" y="362" width="215" height="60" rx="9" ry="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" /></g><g><g><text x="120" y="387" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="120" y="387">缺失或评分异常</tspan><tspan x="120" y="406">阻止接受，先补齐</tspan></text></g></g></g><g data-cell-id="pass"><g transform="translate(0.5,0.5)"><path d="M 547 347 L 637 394.5 L 547 442 L 457 394.5 Z" fill="#fff7ed" stroke="#d97706" stroke-miterlimit="10" stroke-width="1.6" /></g><g><g><text x="547" y="390" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="547" y="390">候选所有关键</tspan><tspan x="547" y="409">条件都通过？</tspan></text></g></g></g><g data-cell-id="reject"><g transform="translate(0.5,0.5)"><rect x="447" y="497" width="240" height="60" rx="9" ry="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" /></g><g><g><text x="567" y="522" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="567" y="522">有明确失败</tspan><tspan x="567" y="541">拒绝，保留待复核样本</tspan></text></g></g></g><g data-cell-id="accept"><g transform="translate(0.5,0.5)"><rect x="72" y="497" width="290" height="60" rx="9" ry="9" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6" /></g><g><g><text x="217" y="522" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="217" y="522">范围内接受或未见退化</tspan><tspan x="217" y="541">分别保存，不能替代上线决策</tspan></text></g></g></g><g data-cell-id="next"><g transform="translate(0.5,0.5)"><rect x="227" y="627" width="260" height="60" rx="9" ry="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" /></g><g><g><text x="357" y="652" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="357" y="652">复核失败原因后再补题</tspan><tspan x="357" y="671">最小修复，重新运行</tspan></text></g></g></g><g data-cell-id="edge-0"><g transform="translate(0.5,0.5)"><path d="M 347 72 L 347 94.5 L 357 94.5 L 357 108.88" fill="none" stroke="#687d93" stroke-miterlimit="10" stroke-width="1.6" /><path d="M 357 115.88 L 353.5 108.88 L 360.5 108.88 Z" fill="#687d93" stroke="#687d93" stroke-miterlimit="10" stroke-width="1.6" /></g></g><g data-cell-id="edge-1"><g transform="translate(0.5,0.5)"><path d="M 357 182 L 357 218.88" fill="none" stroke="#687d93" stroke-miterlimit="10" stroke-width="1.6" /><path d="M 357 225.88 L 353.5 218.88 L 360.5 218.88 Z" fill="#687d93" stroke="#687d93" stroke-miterlimit="10" stroke-width="1.6" /></g></g><g data-cell-id="edge-2"><g transform="translate(0.5,0.5)"><path d="M 267 274.5 L 119.5 274.5 L 119.5 353.88" fill="none" stroke="#687d93" stroke-miterlimit="10" stroke-width="1.6" /><path d="M 119.5 360.88 L 116 353.88 L 123 353.88 Z" fill="#687d93" stroke="#687d93" stroke-miterlimit="10" stroke-width="1.6" /></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="13px"><text x="149" y="280" font-size="14" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#334155" font-weight="500" paint-order="stroke" stroke="#fafbfc" stroke-width="5">否</text></g></g></g><g data-cell-id="edge-3"><g 