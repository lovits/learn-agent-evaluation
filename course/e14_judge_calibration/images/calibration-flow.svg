<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" viewBox="0 0 665 632" width="665" height="632"><title id="title">第14课：标准、标签与分歧处理</title><desc id="desc">保留本课机制和评测关系。原生 SVG 文字与路径，放大可读。</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a5f" /><stop offset="100%" stop-color="#2563eb" /></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker></defs><rect width="100%" height="100%" rx="8" fill="#fafbfc" /><rect width="100%" height="48" rx="8" fill="url(#header)" /><rect x="0" y="40" width="100%" height="8" fill="url(#header)" /><text x="332.5" y="31" fill="white" font-size="18" text-anchor="middle" font-weight="700"><tspan x="332.5" y="31">第14课：标准、标签与分歧处理</tspan></text><g transform="translate(12,64)"><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="contract"><g transform="translate(0.5,0.5)"><rect x="207" y="12" width="210" height="60" rx="9" ry="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.6" /></g><g><g><text x="312" y="37" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="312" y="37">先固定可接受标准</tspan><tspan x="312" y="56">关键条件与证据范围</tspan></text></g></g></g><g data-cell-id="label"><g transform="translate(0.5,0.5)"><rect x="207" y="122" width="210" height="60" rx="9" ry="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" /></g><g><g><text x="312" y="147" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="312" y="147">独立标注与理由</tspan><tspan x="312" y="166">本课参考为构造示例</tspan></text></g></g></g><g data-cell-id="agree"><g transform="translate(0.5,0.5)"><path d="M 312 232 L 397 282 L 312 332 L 227 282 Z" fill="#fff7ed" stroke="#d97706" stroke-miterlimit="10" stroke-width="1.6" /></g><g><g><text x="312" y="277" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="312" y="277">标注一致或</tspan><tspan x="312" y="296">已经仲裁？</tspan></text></g></g></g><g data-cell-id="known"><g transform="translate(0.5,0.5)"><rect x="12" y="372" width="200" height="60" rx="9" ry="9" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6" /></g><g><g><text x="112" y="397" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="112" y="397">保留已确定标签</tspan><tspan x="112" y="416">可用于对照</tspan></text></g></g></g><g data-cell-id="pending"><g transform="translate(0.5,0.5)"><rect x="417" y="372" width="210" height="60" rx="9" ry="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" /></g><g><g><text x="522" y="397" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="522" y="397">保留分歧或未标注</tspan><tspan x="522" y="416">不冒充确定真值</tspan></text></g></g></g><g data-cell-id="split"><g transform="translate(0.5,0.5)"><rect x="207" y="482" width="210" height="60" rx="9" ry="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" /></g><g><g><text x="312" y="507" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="312" y="507">按题族分开</tspan><tspan x="312" y="526">开发示例与留出验证</tspan></text></g></g></g><g data-cell-id="edge-0"><g transform="translate(0.5,0.5)"><path d="M 312 72 L 312 113.88" fill="none" stroke="#687d93" stroke-miterlimit="10" stroke-width="1.6" /><path d="M 312 120.88 L 308.5 113.88 L 315.5 113.88 Z" fill="#687d93" stroke="#68