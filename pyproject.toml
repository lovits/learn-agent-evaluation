[project]
name = "learn-agent-evaluation"
version = "0.1.0"
description = "A Chinese project-based RAG and agent evaluation course"
requires-python = ">=3.11,<3.13"
dependencies = [
  "deepeval",
  "langchain-community>=0.3,<0.4",
  "markdown-it-py>=3,<5",
  "pocketflow>=0.0.3,<0.1",
  "pathspec>=0.12,<1",
  "pyyaml>=6,<7",
  "requests>=2.31,<3",
  "gitpython>=3.1,<4",
  "scikit-learn>=1.6,<1.8",
  "numpy>=1.26,<3",
  "anthropic>=0.70,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv.sources]
deepeval = { git = "https://github.com/confident-ai/deepeval.git", rev = "34db63dd005ebc9a905c8ef4741ae0687c93c14c" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:deepeval"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
