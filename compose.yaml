services:
  course:
    build: .
    image: learn-agent-evaluation:local
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${COURSE_PORT:-8765}:8000"
    environment:
      KNOWLEDGE_DIR: /data/knowledge
      RUNS_DIR: /data/runs
      JUDGE_MODEL: "${JUDGE_MODEL:-}"
      JUDGE_BASE_URL: "${JUDGE_BASE_URL:-https://api.openai.com/v1}"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      RAGAS_DO_NOT_TRACK: "true"
    volumes:
      - type: bind
        source: ${KNOWLEDGE_DIR:-./knowledge_base}
        target: /data/knowledge
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runs
        target: /data/runs
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
