<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" viewBox="0 0 650 452" width="650" height="452"><title id="title">第9课：答案质量的比较对象</title><desc id="desc">保留本课机制和评测关系。原生 SVG 文字与路径，放大可读。</desc><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a5f" /><stop offset="100%" stop-color="#2563eb" /></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker></defs><rect width="100%" height="100%" rx="8" fill="#fafbfc" /><rect width="100%" height="48" rx="8" fill="url(#header)" /><rect x="0" y="40" width="100%" height="8" fill="url(#header)" /><text x="325.0" y="31" fill="white" font-size="18" text-anchor="middle" font-weight="700"><tspan x="325.0" y="31">第9课：答案质量的比较对象</tspan></text><g transform="translate(12,64)"><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="question"><g transform="translate(0.5,0.5)"><rect x="212" y="12" width="190" height="60" rx="9" ry="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.6" /></g><g><g><text x="307" y="37" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="307" y="37">同一问题与不同回答</tspan><tspan x="307" y="56">分别检查质量维度</tspan></text></g></g></g><g data-cell-id="relevance"><g transform="translate(0.5,0.5)"><rect x="12" y="152" width="180" height="60" rx="9" ry="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" /></g><g><g><text x="102" y="177" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="102" y="177">问题 ↔ 回答陈述</tspan><tspan x="102" y="196">是否切题</tspan></text></g></g></g><g data-cell-id="facts"><g transform="translate(0.5,0.5)"><rect x="222" y="152" width="180" height="60" rx="9" ry="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" /></g><g><g><text x="312" y="177" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="312" y="177">参考事实 ↔ 回答事实</tspan><tspan x="312" y="196">正确范围与遗漏</tspan></text></g></g></g><g data-cell-id="policy"><g transform="translate(0.5,0.5)"><rect x="432" y="152" width="180" height="60" rx="9" ry="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" /></g><g><g><text x="522" y="177" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="522" y="177">可见资料 ↔ 回答</tspan><tspan x="522" y="196">应回答还是拒答</tspan></text></g></g></g><g data-cell-id="result"><g transform="translate(0.5,0.5)"><rect x="202" y="302" width="220" height="60" rx="9" ry="9" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6" /></g><g><g><text x="312" y="327" fill="#334155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.0" text-anchor="middle" font-weight="500"><tspan x="312" y="327">保留各维度与理由</tspan><tspan x="312" y="346">不合成未经校准的总分</tspan></text></g></g></g><g data-cell-id="edge-0"><g transform="translate(0.5,0.5)"><path d="M 240.5 72 L 240.5 112 L 102 112 L 102 143.88" fill="none" stroke="#687d93" stroke-miterlimit="10" stroke-width="1.6" /><path d="M 102 150.88 L 98.5 143.88 L 105.5 143.88 Z" fill="#687d93" stroke="#687d93" stroke-miterlimit="10" stroke-width="1.6" /></g></g><g data-cell-id="edge-1"><g transform="translate(0.5,0.5)"><path d="M 307 72 L 307 112 L 312 112 L 312 143.88" fill="none" stroke="#687d93" stroke-miterlimit="10" stroke-width="1.6" /><path d="M 312 150.88 L 308.5 143.88 L 315.5 143.88 Z" fill="#687d93" stroke="#687d93" stroke-miterlimit="10" stroke-width="1.6" /></g></g><g data-cell-id="edge-2"><g transform="translate(0.5,